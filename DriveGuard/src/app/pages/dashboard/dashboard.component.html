<div class="dashboard-container">
  <app-dashboard-header [currentUser]="currentUser" (logoutClick)="onLogout()"></app-dashboard-header>

  <main class="dashboard-main" *ngIf="showDashboard">
    <div class="welcome-section">
      <h2>Welcome, {{ currentUser?.username }}!</h2>
      <p>You are now logged into the DriveGuard monitoring system.</p>
    </div>

    <div class="features-grid">
      <app-feature-card
        *ngFor="let feature of features"
        [icon]="feature.icon"
        [type]="feature.type"
        [title]="feature.title"
        [description]="feature.description"
        (cardClicked)="onFeatureCardClick($event)">
      </app-feature-card>
    </div>
  </main>

  <!-- <app-active-trips *ngIf="!showDashboard" (backClick)="onBackToMain()"></app-active-trips> -->

  <router-outlet></router-outlet>
</div>
